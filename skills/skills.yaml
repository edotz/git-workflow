version: "1.0"

skills:
  - name: git-workflow
    type: guide
    description: >
      Use when work in a repository with a components.yaml and the edotz git-workflow plugin
      involves starting a branch, committing, naming or opening a pull request, releasing a
      version, promoting a release branch, splitting a monorepo component to its child
      repository or syncing branch rulesets, or when an app git command refuses a step or a
      release proposes nothing.
