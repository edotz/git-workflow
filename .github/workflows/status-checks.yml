name: Status Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - '**'

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate conventional commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
      - name: Validate the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/commitlint" @commitlint/cli@21 @commitlint/config-conventional@21
          printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | NODE_PATH="$RUNNER_TEMP/commitlint/node_modules" "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" --config commitlint.config.mjs
      - name: Run the checks declared in components.yaml
        run: |
          if [ ! -f components.yaml ]; then
            echo "components.yaml not found: no declared checks to run"
            exit 0
          fi
          failed=0
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "::group::${cmd}"
            bash -c "$cmd" || { echo "::error::check failed: ${cmd}"; failed=1; }
            echo "::endgroup::"
          done < <(yq -r '.components[].checks[]?' components.yaml)
          exit "$failed"
