services:
  tools:
    image: edotz-git-workflow-tools:${PLUGIN_EDOTZ_GIT_WORKFLOW_GIT_CLIFF_VERSION:?}-${PLUGIN_EDOTZ_GIT_WORKFLOW_GH_VERSION:?}
    platform: ${PLUGIN_EDOTZ_GIT_WORKFLOW_IMAGE_PLATFORM:?}
    build:
      context: ..
      dockerfile: Dockerfile
      platforms:
        - ${PLUGIN_EDOTZ_GIT_WORKFLOW_IMAGE_PLATFORM:?}
      args:
        IMAGE_BASE: ${PLUGIN_EDOTZ_GIT_WORKFLOW_IMAGE_BASE:?}
        GIT_CLIFF_VERSION: ${PLUGIN_EDOTZ_GIT_WORKFLOW_GIT_CLIFF_VERSION:?}
        GIT_CLIFF_SHA512: ${PLUGIN_EDOTZ_GIT_WORKFLOW_GIT_CLIFF_SHA512:?}
        SPLITSH_VERSION: ${PLUGIN_EDOTZ_GIT_WORKFLOW_SPLITSH_VERSION:?}
        SPLITSH_SHA256: ${PLUGIN_EDOTZ_GIT_WORKFLOW_SPLITSH_SHA256:?}
        GH_VERSION: ${PLUGIN_EDOTZ_GIT_WORKFLOW_GH_VERSION:?}
        GH_SHA256: ${PLUGIN_EDOTZ_GIT_WORKFLOW_GH_SHA256:?}
        GIT_APT_VERSION: ${PLUGIN_EDOTZ_GIT_WORKFLOW_GIT_APT_VERSION:?}
