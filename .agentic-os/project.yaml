version: "1.0"

# Technology — what the project is built with. /aos:discover proposes entries.
# id:    short identifier
# label: human-readable description
# root:  path relative to PROJECT_ROOT where this technology lives
technology: []
#  - id: example
#    label: "Human-readable description"
#    root: "src/example"

# Toolchain — the linters of the project; a field left out comes from the preset of the linter name.
# node has no preset: Biome runs through the biome.json at the project root (config_flag ends in = so the path is joined to it).
toolchain:
  linters:
    - name: node
      binary: biome
      args: [lint]
      extensions: [js, mjs, cjs]
      config: .
      config_flag: --config-path=
      install_hint: "npm ci"
    - name: shell
      install_hint: "npm ci"

# Plugins the project uses, in precedence order (a later entry wins over an earlier one).
# Each plugin needs a plugin.yaml at its root. `bash bin/app plugins list` shows the registry.
plugins:
  - name: edotz.git-workflow
    path: "."
#  - name: example-plugin
#    path: "../example-plugin"   # relative to the project root, or absolute

# Selectors — the axes agentic-os offers when it is called (flag or prompt). A project that declares none is never asked.
# purpose: what the checkout is loaded for; a plugin that delivers agentic-os content declares project and deliverable.
# view: personas whose capability scope differs; declare options to offer them.
selectors:
  purpose:
    options: [project, deliverable]
    default: project
#  view:
#    options: [developer, architect, tester]
#    default: developer
