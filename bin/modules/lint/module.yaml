domain: lint
description: "Multi-language linting utilities."

commands:
  - name: "node"
    requires: [node]
    description: "Lint JavaScript files (*.js, *.mjs, *.cjs) with the Biome of the plugin. Usage: bash bin/app lint node [staged|changed|full|specific <files>]"
    when: "A Node file of the plugin changed, or before a commit that touches one"
    examples:
      - "bash $BU_ROOT/app lint node full"
      - "bash $BU_ROOT/app lint node specific bin/modules/git/token-service.mjs"
